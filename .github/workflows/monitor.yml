name: Monitor lua de mel

on:
  schedule:
    # 24x/dia, de hora em hora (00h17, 01h17 ... 23h17).
    # Minuto 17 em vez de 0: na virada da hora o GitHub fica sobrecarregado e atrasa ou pula execuções agendadas.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# O disparo externo (cron-job.org) e o agendamento do GitHub podem coincidir:
# uma execução espera a outra terminar, para não brigarem ao salvar o state.json.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Procurar promoções
        run: python monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Salvar o que já foi avisado
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Atualiza estado do monitor" && git pull --rebase && git push)
